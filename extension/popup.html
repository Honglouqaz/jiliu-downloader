<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root{
    --bg:#12151b; --panel:#1a1f27; --line:#2a3140; --text:#e6e9ef;
    --dim:#8b93a3; --dim2:#5f6878; --accent:#3fd0c9; --ok:#4ade80; --err:#f87171; --warn:#fbbf24;
  }
  *{box-sizing:border-box}
  body{
    width:400px; margin:0; padding:12px; background:var(--bg); color:var(--text);
    font:13px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  }
  .top{display:flex; align-items:center; gap:8px; margin-bottom:10px}
  .top b{font-size:14px; letter-spacing:.4px}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--dim2); flex:none}
  .dot.on{background:var(--ok)}
  .dot.off{background:var(--err)}
  .top .st{font-size:11px; color:var(--dim); margin-left:auto; text-align:right}

  .box{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:10px}
  .lbl{font-size:11px; color:var(--dim2); margin-bottom:6px; display:flex; justify-content:space-between; align-items:center}
  .lbl button{font-size:11px; padding:2px 7px}

  input,select,button{
    font:inherit; font-size:12.5px; color:var(--text); background:#141922;
    border:1px solid var(--line); border-radius:6px; padding:6px 9px; outline:none
  }
  input{width:100%}
  input:focus,select:focus{border-color:var(--accent)}
  input::placeholder{color:var(--dim2)}
  button{cursor:pointer; transition:.15s; white-space:nowrap}
  button:hover{border-color:var(--accent); color:var(--accent)}
  button.p{background:linear-gradient(180deg,var(--accent),#2ba8a2); color:#08110f; border:none; font-weight:600}
  button.p:hover{filter:brightness(1.08); color:#08110f}
  .row{display:flex; gap:6px; align-items:center; margin-top:6px}
  .row select{flex:none; width:96px}

  .list{max-height:236px; overflow:auto; margin:-2px -2px 0}
  .it{display:flex; gap:8px; align-items:center; padding:6px 4px; border-bottom:1px solid #22283480}
  .it:last-child{border-bottom:none}
  .it .k{
    font-size:10px; padding:1px 5px; border-radius:4px; border:1px solid var(--line);
    color:var(--dim); flex:none
  }
  .it .k.stream{color:var(--warn); border-color:#5a4a1f}
  .it .k.audio{color:#8ab4f8; border-color:#2f4470}
  .it .u{flex:1; min-width:0; font-size:11.5px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .it .u:hover{color:var(--accent)}
  .empty{color:var(--dim2); font-size:11.5px; text-align:center; padding:16px 0}

  .foot{display:flex; gap:6px; align-items:center; font-size:11px; color:var(--dim2)}
  #toast{font-size:11.5px; margin-top:8px; min-height:15px}
  #toast.err{color:var(--err)}
  #toast.ok{color:var(--ok)}
  details summary{cursor:pointer; font-size:11.5px; color:var(--dim); outline:none}
  details{margin-top:8px}
  .cfgrow{display:flex; gap:6px; align-items:center; margin-top:7px}
  .cfgrow label{font-size:11px; color:var(--dim2); width:88px; flex:none}
</style>
</head>
<body>

  <div class="top">
    <span class="dot" id="dot"></span>
    <b>汲流</b>
    <span class="st" id="status">检查中…</span>
  </div>

  <div class="box">
    <div class="lbl">
      <span>本页发现的媒体</span>
      <span><button id="btnRescan">重扫</button></span>
    </div>
    <div class="list" id="list"><div class="empty">正在扫描…</div></div>
  </div>

  <div class="box">
    <div class="lbl"><span>手动添加</span></div>
    <input id="url" placeholder="直链或视频页地址">
    <div class="row">
      <select id="kind">
        <option value="auto">自动</option>
        <option value="http">直链</option>
        <option value="video">视频</option>
      </select>
      <button class="p" id="btnAdd" style="flex:1">交给汲流下载</button>
      <button id="btnMotrix">Motrix</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="btnClassify" style="flex:1">识别这个链接是什么文件</button>
    </div>
    <div id="planBox" style="font-size:11px; color:var(--dim); margin-top:7px; line-height:1.6"></div>
  </div>

  <div class="box">
    <div class="lbl"><span>下载接管</span><span id="icTag" style="color:var(--dim2)"></span></div>
    <div class="row">
      <select id="interceptMode" style="width:auto; flex:1">
        <option value="off">关闭：浏览器自己下</option>
        <option value="smart">智能：该接的才接（推荐）</option>
        <option value="all">全部：能接就接</option>
      </select>
    </div>
    <div style="font-size:11px; color:var(--dim2); margin-top:6px">
      智能模式下，安装包 / 压缩包 / 镜像 / 音视频 / 大文件交给汲流多线程下；
      小图片、字体、网页更新包放行给浏览器。判断前会先挂起下载，不会白下流量。
    </div>
  </div>

  <details>
    <summary>设置</summary>
    <div class="cfgrow">
      <label>API 地址</label>
      <input id="apiBase" placeholder="http://127.0.0.1:8788">
    </div>
    <div class="cfgrow">
      <label>默认走 Motrix</label>
      <input type="checkbox" id="preferMotrix" style="width:auto">
    </div>
    <div class="cfgrow">
      <label>接管时通知</label>
      <input type="checkbox" id="notifyOnTake" style="width:auto">
    </div>
    <div class="cfgrow" style="align-items:flex-start">
      <label>豁免域名</label>
      <input id="skipHosts" placeholder="每行一个，如 dl.google.com">
    </div>
    <div class="row"><button id="btnSaveCfg">保存</button></div>
  </details>

  <div id="toast"></div>

<script src="popup.js"></script>
</body>
</html>
