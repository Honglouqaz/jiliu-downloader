<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>正在唤起汲流…</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #14161a; color: #e8eaed;
    font: 14px/1.7 "Microsoft YaHei", system-ui, sans-serif;
  }
  .box { width: 420px; padding: 28px 30px; border-radius: 14px;
         background: #1c1f25; border: 1px solid #2b3038; text-align: center; }
  h1 { margin: 0 0 10px; font-size: 17px; font-weight: 600; }
  p  { margin: 6px 0; color: #9aa4b2; font-size: 13px; }
  .spec { margin: 14px 0 0; padding: 9px 11px; border-radius: 8px;
          background: #12141a; color: #7f8a99; font: 12px/1.5 Consolas, monospace;
          word-break: break-all; text-align: left; max-height: 84px; overflow: auto; }
  button { margin-top: 16px; padding: 9px 22px; border: 0; border-radius: 8px;
           background: #2f6bff; color: #fff; font-size: 13.5px; cursor: pointer; }
  button:hover { background: #3f7bff; }
  .hint { margin-top: 14px; font-size: 12px; color: #6b7480; }
  .spin { display: inline-block; width: 13px; height: 13px; margin-right: 7px;
          border: 2px solid #3a4150; border-top-color: #2f6bff; border-radius: 50%;
          vertical-align: -2px; animation: sp .8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  @media (prefers-color-scheme: light) {
    body { background: #f4f6f9; color: #1b1f27; }
    .box { background: #fff; border-color: #e2e6ec; }
    p { color: #5b6472; }
    .spec { background: #f4f6f9; color: #4a5361; }
    .hint { color: #8b94a1; }
  }
</style>
</head>
<body>
  <div class="box">
    <h1><span class="spin"></span>正在唤起汲流…</h1>
    <p id="msg">如果浏览器弹出「是否打开汲流」，请点「打开」。</p>
    <div class="spec" id="spec"></div>
    <button id="again" style="display:none">没反应？点这里再试一次</button>
    <div class="hint" id="hint">唤起成功后本页会自动关闭</div>
  </div>
  <script src="launch.js"></script>
</body>
</html>
